<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026-2 학기 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #eef2ef;
    --bg-grid: rgba(27, 110, 99, 0.07);
    --surface: #ffffff;
    --surface-2: #f4f7f5;
    --border: #d7e0da;
    --text: #16211c;
    --text-muted: #58685f;
    --accent: #1b6e63;
    --accent-soft: #e2f0ec;
    --danger: #b6503f;
    --warning: #ad7422;
    --success: #3f8f5c;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.04), 0 8px 24px -16px rgba(20, 30, 25, 0.18);

    --c-climate: #d96a5b;
    --c-geoedu: #7fa143;
    --c-disaster: #dd9640;
    --c-gis: #3a9c7c;
    --c-specialedu: #379e91;
    --c-politicalgeo: #8c76cf;
    --c-econgeo: #c99a2e;
    --c-curriculum: #5c8fd6;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1512;
      --bg-grid: rgba(255, 255, 255, 0.045);
      --surface: #16211d;
      --surface-2: #1c2823;
      --border: rgba(255, 255, 255, 0.1);
      --text: #e9f0ec;
      --text-muted: #93a69c;
      --accent: #5fcdba;
      --accent-soft: rgba(95, 205, 186, 0.14);
      --danger: #e28675;
      --warning: #e0ac5c;
      --success: #77cf94;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.5);

      --c-climate: #e08373;
      --c-geoedu: #9bbd5f;
      --c-disaster: #e8ab5e;
      --c-gis: #57b895;
      --c-specialedu: #54baac;
      --c-politicalgeo: #a795e0;
      --c-econgeo: #ddb452;
      --c-curriculum: #7ea8e0;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e1512;
    --bg-grid: rgba(255, 255, 255, 0.045);
    --surface: #16211d;
    --surface-2: #1c2823;
    --border: rgba(255, 255, 255, 0.1);
    --text: #e9f0ec;
    --text-muted: #93a69c;
    --accent: #5fcdba;
    --accent-soft: rgba(95, 205, 186, 0.14);
    --danger: #e28675;
    --warning: #e0ac5c;
    --success: #77cf94;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -16px rgba(0, 0, 0, 0.5);

    --c-climate: #e08373;
    --c-geoedu: #9bbd5f;
    --c-disaster: #e8ab5e;
    --c-gis: #57b895;
    --c-specialedu: #54baac;
    --c-politicalgeo: #a795e0;
    --c-econgeo: #ddb452;
    --c-curriculum: #7ea8e0;
  }

  * { box-sizing: border-box; }

  body {
    background:
      repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 28px),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    padding-inline: 20px;
    padding-block: 28px 60px;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
  }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .titleblock { max-width: 46ch; }

  h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.1rem);
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 8px;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin: 0;
  }

  .top-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }

  .theme-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 13px 7px 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
  }

  .theme-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .theme-btn .sun-i { display: none; }
  .theme-btn .moon-i { display: block; }
  :root[data-theme="dark"] .theme-btn .sun-i { display: block; }
  :root[data-theme="dark"] .theme-btn .moon-i { display: none; }

  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    box-shadow: var(--shadow);
    text-align: right;
    min-width: 84px;
  }

  .stat .n {
    font-family: "JetBrains Mono", monospace;
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat .l {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  section.tt {
    margin-bottom: 26px;
  }

  section.tt h2, section.upcoming h2, section.list h2 {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-muted);
    margin: 0 0 10px;
    letter-spacing: 0.01em;
  }

  .tt-scroll {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 12px;
  }

  .tt-grid {
    display: grid;
    grid-template-columns: 40px repeat(5, minmax(96px, 1fr));
    grid-template-rows: 26px repeat(9, minmax(42px, auto));
    min-width: 620px;
    gap: 2px;
  }

  .tt-daylabel {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-muted);
    text-align: center;
    align-self: center;
  }

  .tt-hourlabel {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: right;
    padding-right: 4px;
    align-self: start;
  }

  .tt-cellbg {
    background: var(--surface-2);
    border-radius: 4px;
  }

  .tt-block {
    position: relative;
    background: color-mix(in srgb, var(--c) 20%, var(--surface));
    border-left: 3px solid var(--c);
    border-radius: 7px;
    padding: 5px 7px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    margin: 1px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 2px;
    min-height: 100%;
  }

  .tt-block:hover { background: color-mix(in srgb, var(--c) 32%, var(--surface)); }
  .tt-block:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tt-block .bn {
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .tt-block .br {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.62rem;
    color: var(--text-muted);
  }

  .tt-block .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--danger);
    color: white;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.62rem;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
  }

  section.upcoming {
    margin-bottom: 26px;
  }

  .upcoming-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px 7px 10px;
    box-shadow: var(--shadow);
    max-width: 280px;
  }

  .chip .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--dot, var(--accent));
  }

  .chip .ct {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.84rem;
  }

  .chip .cd {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px;
    flex: 0 0 auto;
  }

  .empty-upcoming {
    color: var(--text-muted);
    font-size: 0.88rem;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    scroll-margin-top: 16px;
  }

  .card.flash {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card .stripe {
    height: 4px;
    background: var(--c);
  }

  .card .head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  .card .head .name {
    font-family: "Noto Serif KR", serif;
    font-weight: 900;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: 8px;
    text-wrap: balance;
  }

  .card .head .name .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--c);
    flex: 0 0 auto;
  }

  .card .head .coord {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 5px;
    letter-spacing: 0.01em;
  }

  .items {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 6px;
    border-radius: 8px;
  }

  .item:hover {
    background: var(--surface-2);
  }

  .item .chk {
    appearance: none;
    width: 17px;
    height: 17px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    margin-top: 2px;
    flex: 0 0 auto;
    cursor: pointer;
    display: grid;
    place-content: center;
    background: var(--surface);
  }

  .item .chk:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .item .chk:checked::after {
    content: "";
    width: 5px;
    height: 9px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .item .body {
    flex: 1;
    min-width: 0;
  }

  .item .txt {
    font-size: 0.9rem;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .item.done .txt {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .item .due {
    display: inline-block;
    margin-top: 3px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-muted);
  }

  .item .due.d-warn { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .item .due.d-danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }

  .item .del {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
    flex: 0 0 auto;
  }

  .item .del:hover {
    background: var(--surface-2);
    color: var(--danger);
  }

  .empty-item {
    color: var(--text-muted);
    font-size: 0.83rem;
    padding: 10px 6px;
  }

  form.add {
    display: flex;
    gap: 6px;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    flex-wrap: wrap;
  }

  form.add input[type="text"] {
    flex: 1 1 140px;
    min-width: 0;
  }

  form.add input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 0.85rem;
    color: var(--text);
    font-family: inherit;
  }

  form.add input[type="date"] {
    flex: 0 0 132px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
  }

  form.add input:focus-visible,
  .item .chk:focus-visible,
  .item .del:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  form.add button {
    flex: 0 0 auto;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  form.add button:hover { filter: brightness(1.08); }

  .card .foot {
    padding: 7px 16px 12px;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: "JetBrains Mono", monospace;
  }

  .notice {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
  }

  section.list { margin-top: 4px; }

  footer.note {
    margin-top: 28px;
    color: var(--text-muted);
    font-size: 0.78rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .card.flash { transition: outline-color 0.2s ease; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titleblock">
      <p class="eyebrow">2026 · 2학기</p>
      <h1>과목별 과제 &amp; 공지 현황판</h1>
      <p class="sub">위 시간표에서 과목을 누르면 아래 해당 카드로 이동해요. 과제·제출물·공지를 체크리스트로 정리하고, 입력한 내용은 자동 저장됩니다.</p>
    </div>
    <div class="top-right">
      <button class="theme-btn" id="themeBtn" type="button" aria-pressed="false">
        <svg class="sun-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span id="themeBtnLabel">다크 모드</span>
      </button>
      <div class="stats">
        <div class="stat"><div class="n mono" id="statOpen">–</div><div class="l">미완료</div></div>
        <div class="stat"><div class="n mono" id="statDone">–</div><div class="l">완료</div></div>
        <div class="stat"><div class="n mono" id="statSoon">–</div><div class="l">7일 이내</div></div>
      </div>
    </div>
  </header>

  <div id="noticeBox"></div>

  <section class="tt">
    <h2>시간표</h2>
    <div class="tt-scroll">
      <div class="tt-grid" id="ttGrid"></div>
    </div>
  </section>

  <section class="upcoming">
    <h2>임박한 마감</h2>
    <div id="upcomingWrap"></div>
  </section>

  <section class="list">
    <h2>과목별 현황</h2>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="note">항목 체크박스로 완료 표시, ×로 삭제할 수 있어요. 마감일 없이 메모만 남겨도 됩니다.</footer>
</div>

<script>
(function () {
  const SUBJECTS = [
    { id: "climate", name: "기후학", room: "E1-2-430", time: "월 10:00–13:00", c: "var(--c-climate)" },
    { id: "geoedu", name: "지리교육과정론", room: "E1-2-415", time: "화 09:00–12:00", c: "var(--c-geoedu)" },
    { id: "disaster", name: "재해와 인간생활", room: "E1-2-430", time: "수 09:00–11:00", c: "var(--c-disaster)" },
    { id: "gis", name: "지리정보체계 및 원격탐사론", room: "N23-407", time: "목 09:00–13:00", c: "var(--c-gis)" },
    { id: "specialedu", name: "특수교육학개론", room: "N14-205", time: "화 13:00–15:00", c: "var(--c-specialedu)" },
    { id: "politicalgeo", name: "정치지리학", room: "E1-2-415", time: "수 16:00–17:00 · 목 14:00–15:00", c: "var(--c-politicalgeo)" },
    { id: "econgeo", name: "경제지리학", room: "E1-2-413", time: "월 15:00–17:00", c: "var(--c-econgeo)" },
    { id: "curriculum", name: "교육과정", room: "N23-202", time: "화 16:00–17:00", c: "var(--c-curriculum)" }
  ];

  // day: 1=월 ... 5=금. hour = 24h start/end.
  const BLOCKS = [
    { subject: "climate", day: 1, start: 10, end: 13 },
    { subject: "geoedu", day: 2, start: 9, end: 12 },
    { subject: "disaster", day: 3, start: 9, end: 11 },
    { subject: "gis", day: 4, start: 9, end: 13 },
    { subject: "specialedu", day: 2, start: 13, end: 15 },
    { subject: "politicalgeo", day: 3, start: 16, end: 17 },
    { subject: "politicalgeo", day: 4, start: 14, end: 15 },
    { subject: "econgeo", day: 1, start: 15, end: 17 },
    { subject: "curriculum", day: 2, start: 16, end: 17 }
  ];
  const HOURS = [9, 10, 11, 12, 13, 14, 15, 16, 17];
  const DAYS = ["월", "화", "수", "목", "금"];
  const bySubject = Object.fromEntries(SUBJECTS.map((s) => [s.id, s]));

  const gridEl = document.getElementById("grid");
  const ttGrid = document.getElementById("ttGrid");
  const upcomingWrap = document.getElementById("upcomingWrap");
  const noticeBox = document.getElementById("noticeBox");
  const statOpen = document.getElementById("statOpen");
  const statDone = document.getElementById("statDone");
  const statSoon = document.getElementById("statSoon");
  const themeBtn = document.getElementById("themeBtn");
  const themeBtnLabel = document.getElementById("themeBtnLabel");

  // ---- theme toggle ----
  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function currentTheme() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;
    return systemPrefersDark() ? "dark" : "light";
  }
  function applyTheme(mode, persist) {
    document.documentElement.setAttribute("data-theme", mode);
    themeBtn.setAttribute("aria-pressed", String(mode === "dark"));
    themeBtnLabel.textContent = mode === "dark" ? "라이트 모드" : "다크 모드";
    if (persist) {
      try { localStorage.setItem("tt-theme", mode); } catch (e) {}
    }
  }
  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("tt-theme"); } catch (e) {}
    applyTheme(saved === "light" || saved === "dark" ? saved : currentTheme(), false);
  })();
  themeBtn.addEventListener("click", () => {
    applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
  });

  // ---- build weekly timetable grid ----
  (function buildTimetable() {
    let html = '<div></div>';
    DAYS.forEach((d) => { html += '<div class="tt-daylabel">' + d + "</div>"; });
    HOURS.forEach((h, i) => {
      const label = h > 12 ? h - 12 : h;
      html += '<div class="tt-hourlabel mono" style="grid-row:' + (i + 2) + ';grid-column:1;">' + label + "</div>";
      for (let d = 1; d <= 5; d++) {
        html += '<div class="tt-cellbg" style="grid-row:' + (i + 2) + ';grid-column:' + (d + 1) + ';"></div>';
      }
    });
    BLOCKS.forEach((b) => {
      const s = bySubject[b.subject];
      const rs = HOURS.indexOf(b.start) + 2;
      const re = HOURS.indexOf(b.end) + 2;
      html +=
        '<button type="button" class="tt-block" data-goto="' + b.subject + '" style="--c:' + s.c +
        ';grid-row:' + rs + "/" + re + ";grid-column:" + (b.day + 1) + ';">' +
          '<span class="bn">' + s.name + "</span>" +
          '<span class="br">' + s.room + "</span>" +
          '<span class="badge" data-badge="' + b.subject + '" hidden>0</span>' +
        "</button>";
    });
    ttGrid.innerHTML = html;
  })();

  ttGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".tt-block");
    if (!btn) return;
    const id = btn.getAttribute("data-goto");
    const card = document.getElementById("card-" + id);
    if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("flash");
    card.setAttribute("tabindex", "-1");
    card.focus({ preventScroll: true });
    setTimeout(() => card.classList.remove("flash"), 1400);
  });

  // ---- build card skeletons up front so the page has real structure at rest ----
  const itemsHostBySubject = {};
  SUBJECTS.forEach((s) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + s.id;
    card.innerHTML =
      '<div class="stripe" style="--c:' + s.c + '"></div>' +
      '<div class="head" style="--c:' + s.c + '">' +
        '<div class="name" style="--c:' + s.c + '"><span class="dot"></span>' + s.name + "</div>" +
        '<div class="coord mono">' + s.room + " · " + s.time + "</div>" +
      "</div>" +
      '<div class="items" data-subject="' + s.id + '"><div class="empty-item">불러오는 중…</div></div>' +
      '<form class="add" data-subject="' + s.id + '">' +
        '<input type="text" placeholder="과제·공지 입력" maxlength="140" required />' +
        '<input type="date" />' +
        "<button type=\"submit\">추가</button>" +
      "</form>" +
      '<div class="foot" data-subject-foot="' + s.id + '"></div>';
    gridEl.appendChild(card);
    itemsHostBySubject[s.id] = card.querySelector(".items");
  });

  function todayMid() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function dueInfo(dueStr) {
    if (!dueStr) return null;
    const due = new Date(dueStr + "T00:00:00");
    const diff = Math.round((due - todayMid()) / 86400000);
    let label, cls;
    if (diff < 0) { label = "지남 " + Math.abs(diff) + "일"; cls = "d-danger"; }
    else if (diff === 0) { label = "D-DAY"; cls = "d-danger"; }
    else if (diff <= 3) { label = "D-" + diff; cls = "d-warn"; }
    else { label = "D-" + diff; cls = ""; }
    return { diff, label, cls, dueStr };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function sortItems(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
    if (a.due && !b.due) return -1;
    if (!a.due && b.due) return 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }

  let allItems = [];
  let loaded = false;

  function render() {
    // per-card item lists
    SUBJECTS.forEach((s) => {
      const host = itemsHostBySubject[s.id];
      const items = allItems.filter((it) => it.subject === s.id).sort(sortItems);
      const footEl = document.querySelector('[data-subject-foot="' + s.id + '"]');
      const openCount = items.filter((i) => !i.done).length;
      const doneCount = items.length - openCount;
      if (footEl) footEl.textContent = items.length ? "미완료 " + openCount + " · 완료 " + doneCount : "";

      document.querySelectorAll('[data-badge="' + s.id + '"]').forEach((b) => {
        if (loaded && openCount > 0) { b.hidden = false; b.textContent = String(openCount); }
        else { b.hidden = true; }
      });

      if (!loaded) {
        host.innerHTML = '<div class="empty-item">불러오는 중…</div>';
        return;
      }
      if (!items.length) {
        host.innerHTML = '<div class="empty-item">등록된 과제·메모가 없어요</div>';
        return;
      }
      host.innerHTML = items.map((it) => {
        const di = dueInfo(it.due);
        return (
          '<div class="item ' + (it.done ? "done" : "") + '" data-id="' + it.id + '">' +
            '<input type="checkbox" class="chk" ' + (it.done ? "checked" : "") + ' aria-label="완료 표시" />' +
            '<div class="body">' +
              '<div class="txt">' + escapeHtml(it.text) + "</div>" +
              (di ? '<span class="due ' + di.cls + '">' + di.label + "</span>" : "") +
            "</div>" +
            '<button type="button" class="del" aria-label="삭제" title="삭제">×</button>' +
          "</div>"
        );
      }).join("");
    });

    // stats
    const open = allItems.filter((i) => !i.done);
    statOpen.textContent = loaded ? open.length : "–";
    statDone.textContent = loaded ? (allItems.length - open.length) : "–";
    const soon = open.filter((i) => i.due && dueInfo(i.due).diff <= 7);
    statSoon.textContent = loaded ? soon.length : "–";

    // upcoming strip
    if (!loaded) {
      upcomingWrap.innerHTML = '<div class="empty-upcoming">불러오는 중…</div>';
    } else if (!soon.length) {
      upcomingWrap.innerHTML = '<div class="empty-upcoming">7일 이내로 예정된 마감이 없어요.</div>';
    } else {
      soon.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
      upcomingWrap.innerHTML =
        '<div class="upcoming-row">' +
        soon.slice(0, 16).map((it) => {
          const s = bySubject[it.subject];
          const di = dueInfo(it.due);
          return (
            '<div class="chip" style="--dot:' + s.c + '">' +
              '<span class="dot"></span>' +
              '<span class="ct">' + escapeHtml(s.name) + " · " + escapeHtml(it.text) + "</span>" +
              '<span class="cd due ' + di.cls + '">' + di.label + "</span>" +
            "</div>"
          );
        }).join("") +
        "</div>";
    }
  }

  // ---- storage backend: db capability, or an in-memory fallback ----
  let backend = null;

  function loadLocalItems() {
    try {
      const raw = localStorage.getItem("tt-items");
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }
  function saveLocalItems(items) {
    try { localStorage.setItem("tt-items", JSON.stringify(items)); } catch (e) {}
  }

  function useLocalBackend() {
    noticeBox.innerHTML = '<div class="notice">이 브라우저(기기)에만 저장돼요. 다른 기기나 다른 사람과 함께 보려면 클로드 아티팩트 링크로 열어주세요.</div>';
    let localItems = loadLocalItems();
    let cb = null;
    backend = {
      subscribe(fn) {
        cb = fn;
        fn(localItems);
        return () => { cb = null; };
      },
      add(data) {
        localItems.push(Object.assign({ id: "local-" + Date.now() + "-" + Math.random().toString(36).slice(2) }, data));
        saveLocalItems(localItems);
        if (cb) cb(localItems);
        return Promise.resolve();
      },
      update(id, data) {
        const it = localItems.find((i) => i.id === id);
        if (it) Object.assign(it, data);
        saveLocalItems(localItems);
        if (cb) cb(localItems);
        return Promise.resolve();
      },
      remove(id) {
        localItems = localItems.filter((i) => i.id !== id);
        saveLocalItems(localItems);
        if (cb) cb(localItems);
        return Promise.resolve();
      }
    };
    startSubscription();
  }

  function useDbBackend(db) {
    const col = db.collection("items");
    backend = {
      subscribe(fn) {
        return col.orderBy("createdAt", "asc").limit(500).onSnapshot(
          (snap) => fn(snap.docs.map((d) => Object.assign({ id: d.id }, d.data()))),
          () => useLocalBackend()
        );
      },
      add(data) { return col.add(data); },
      update(id, data) { return db.doc("items/" + id).update(data); },
      remove(id) { return db.doc("items/" + id).delete(); }
    };
    startSubscription();
  }

  function startSubscription() {
    backend.subscribe((items) => {
      allItems = items;
      loaded = true;
      render();
    });
  }

  render(); // initial skeleton paint

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then((db) => {
      if (db) useDbBackend(db); else useLocalBackend();
    }).catch(() => useLocalBackend());
  } else {
    useLocalBackend();
  }

  // event delegation: add forms
  gridEl.addEventListener("submit", (e) => {
    const form = e.target.closest("form.add");
    if (!form) return;
    e.preventDefault();
    const subject = form.getAttribute("data-subject");
    const textInput = form.querySelector('input[type="text"]');
    const dateInput = form.querySelector('input[type="date"]');
    const text = textInput.value.trim();
    if (!text || !backend) return;
    backend.add({ subject, text, due: dateInput.value || null, done: false, createdAt: Date.now() });
    textInput.value = "";
    dateInput.value = "";
    textInput.focus();
  });

  // event delegation: checkbox + delete
  gridEl.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (del && backend) {
      const id = del.closest(".item").getAttribute("data-id");
      backend.remove(id);
    }
  });
  gridEl.addEventListener("change", (e) => {
    if (e.target.classList.contains("chk") && backend) {
      const itemEl = e.target.closest(".item");
      const id = itemEl.getAttribute("data-id");
      const current = allItems.find((i) => i.id === id);
      backend.update(id, { done: !(current && current.done) });
    }
  });
})();
</script>
</body>
</html>
